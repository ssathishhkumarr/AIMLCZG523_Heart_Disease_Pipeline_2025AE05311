name: MLOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest httpx

    - name: Linting with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other issues as warnings to prevent the pipeline from failing over minor style issues
        flake8 src/ app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Model Training
      run: |
        python src/train.py

    - name: Run Unit Tests
      run: |
        PYTHONPATH=. pytest tests/

    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/model.pkl
        if-no-files-found: warn